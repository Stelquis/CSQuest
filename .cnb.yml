# ===================================================================
# CNB 云原生构建配置文件
# ===================================================================

# -----------------------------------------------------------------------------
# 镜像构建与推送（仅 Dockerfile 变更时触发）
# -----------------------------------------------------------------------------
main:
  push:
    - git:
        enable: true
        submodules:
          enable: false
      ifModify:
        - .ide/Dockerfile
      imports:
        - https://cnb.cool/OrionDawn/SecretsHub/-/blob/main/docker.yml
      services:
        - docker
      stages:
        - name: docker build and push
          script: |
            echo "检测到 Dockerfile 改动，触发镜像构建并推送"
            docker login -u cnb -p "${DOCKER_TOKEN}" docker.cnb.cool
            docker build -f .ide/Dockerfile -t docker.cnb.cool/oriondawn/csquest:latest .
            docker push docker.cnb.cool/oriondawn/csquest:latest

# -----------------------------------------------------------------------------
# 云原生开发环境配置
# -----------------------------------------------------------------------------
$:
  vscode:
    - name: CSQuest
      git:
        enable: true
        submodules:
          enable: false
      docker:
        image: docker.cnb.cool/oriondawn/csquest:latest
      services:
        - vscode
        - docker
      stages:
        - name: workspace init
          script: |
            echo "🚀 云原生开发环境已就绪"
